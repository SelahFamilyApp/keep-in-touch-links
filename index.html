:root{--ink:#101014;--grey:#eeeeee;--line:#e4e5ea;--gold:#b89556;--orange:#ff6236}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--grey);font-family:Tajawal,Tahoma,sans-serif;color:var(--ink)}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #ff8f67;outline-offset:3px}

.footer{margin:33px 10px 0;color:#9b9dac;font:400 11px 'DM Sans',sans-serif}.footer b{font-weight:600;color:#a08a60}.notice{font:500 11px Tajawal,sans-serif;color:#999;max-width:330px;margin:11px auto 0;padding:0 12px;line-height:1.6}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;transition:.2s;background:#19191c;color:white;border-radius:30px;padding:12px 18px;font:600 13px Tajawal,sans-serif;max-width:min(360px,90vw);z-index:10;box-shadow:0 5px 25px #0004}.toast.visible{opacity:1;transform:translate(-50%,0)}
